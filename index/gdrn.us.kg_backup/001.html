<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }
        table {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        td {
            text-align: center; /* 保持按钮居中 */
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            text-align: center; /* 添加输入框内文本居中 */
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px; 
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <table>
        <tbody>
            <tr>
                <td><input type="text" id="name" placeholder="名称"><br></td>
            </tr>
            <tr>
                <td><input type="text" id="amount" placeholder="金额"><br></td>
            </tr>
            <tr>
                <td><input type="text" id="merchantOrderId" placeholder="商户订单号"><br></td>
            </tr>
            <tr>
                <td><button type="button" onclick="redirectToServer()">确认</button></td>
            </tr>
            <tr>
                <td><input type="text" id="extra" placeholder="网址"><br></td>
            </tr>
            <tr>
                <td><button type="button" onclick="redirectToLink()">链接</button></td>
            </tr>
        </tbody>
    </table>
    <script>
        // 重定向到服务器的函数
        function redirectToServer() {
            var name = document.getElementById('name').value;
            var amount = document.getElementById('amount').value;
            var baseUrl = '${process.env.BASE_URL}/process.php';
            var merchantOrderId = document.getElementById('merchantOrderId').value;
            var newUrl = baseUrl + '?name=' + encodeURIComponent(name) + 
                         '&amount=' + encodeURIComponent(amount) + 
                         '&merchantOrderId=' + encodeURIComponent(merchantOrderId);
            window.location.href = newUrl;
        }

        // 获取URL参数的函数
        function getQueryVariable(variable) {
            var query = window.location.search.substring(1);
            var vars = query.split('&');
            for (var i = 0; i < vars.length; i++) {
                var pair = vars[i].split('=');
                if (decodeURIComponent(pair[0]) == variable) {
                    return decodeURIComponent(pair[1]);
                }
            }
            return false;
        }

        // 显示URL的函数
        function displayUrl() {
            var websiteUrl = getQueryVariable("website_url");
            if (websiteUrl) {
                document.getElementById('extra').value = websiteUrl;
            }
        }

        // 重定向到链接的函数
        function redirectToLink() {
            var extraUrl = document.getElementById('extra').value;
            window.location.href = extraUrl;
        }

        // 页面加载时显示URL
        window.onload = function() {
            displayUrl();
        };
    </script>
</body>
</html>
