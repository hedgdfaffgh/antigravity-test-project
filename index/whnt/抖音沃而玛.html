<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .arrow {
            font-size: 40px;
            animation: move 1s infinite;
            display: inline-block;
        }

        @keyframes move {
            0% { transform: translateY(0); }
            50% { transform: translateY(10px); }
            100% { transform: translateY(0); }
        }
    </style>
</head>
<body>
    <p class="center" style="font-size: 20pt; text-align: center; line-height: 1; margin-top: 10px;"><span class="red" style="font-family: 黑体; color: rgb(255, 0, 0);">请勿超时-修改号码支付</span></p>
    <p id="countdown" class="center" style="font-size: 20pt; text-align: center; line-height: 1; margin-top: -15px">
    <span style="font-family: 黑体;">支付倒计时<span id="timer">180</span>秒</span>
    </p>
    <p class="center" style="font-size: 20pt; text-align: center; line-height: 1; margin-top: -15px;">
        <span style="font-family: 黑体;">订单金额：{{order_amount}}</span>
    </p>
    <script>
            var countdown = 180;
            var countdownTimer = setInterval(function() {
                countdown--;
                document.getElementById('timer').innerText = countdown;
                if (countdown <= 0) {
                    clearInterval(countdownTimer);
                    alert('支付时间已过请勿支付');
                    window.close();
                }
            }, 1000);
    </script>
    <p class="center" style="font-size: 20pt; text-align: center; line-height: 1; margin-top: -15px;"><span class="red" style="font-family: 黑体; color: rgb(255, 0, 0);">点击下列复制跳转支付</span></p>
    <div style="text-align: center; line-height: 1;">
    <div class="arrow" style="text-align: center; line-height: 1; margin-top: -15px;">↓</div>
    <div class="arrow" style="text-align: center; line-height: 1; margin-top: -15px;">↓</div>
    <div class="arrow" style="text-align: center; line-height: 1; margin-top: -15px;">↓</div>
    <div class="arrow" style="text-align: center; line-height: 1; margin-top: -15px;">↓</div>
    </div>
    <div id="phoneNumberContainer" style="text-align: center; line-height: 1; color: rgb(255, 0, 0); margin-top: 20px;">
    <span id="phoneNumber" style="font-size: 25pt; cursor: pointer;">{{number}}</span>
    </div>
    <div style="height: 30px;"></div>
    <div style="text-align: center; line-height: 1.2; margin-top: -15px;"><span style="font-size: 20pt; font-family: 黑体;">请跟步骤支付</span></div>
    <div style="display: flex; justify-content: center;">
        <img src="https://i.imgs.ovh/2023/10/10/X2ne5.jpeg" alt="图片描述" style="max-width: 100%; display: block; margin: auto;">
    </div>
    <div style="display: flex; justify-content: center;">
        <img src="/uploads/20231007/2023100703112174683.jpg" style="max-width:100%;" border="0">
    </div>
    <p class="center" style="font-size: 20pt; line-height: 1.8;"><span class="black" style="font-family: 黑体;"></span></p>
    <script>
    document.getElementById('phoneNumber').onclick = function() {
        var phoneNumber = this.innerText;
        navigator.clipboard.writeText(phoneNumber).then(function() {
            alert('号码已复制到剪贴板请粘贴到输入框');
            window.location.href = '{{website_url}}';
        }).catch(function(err) {
            console.error('无法复制电话号码: ', err);
        });
    };
    </script>
</body>
</html>
